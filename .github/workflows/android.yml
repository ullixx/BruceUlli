name: Bruce Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK
      uses: actions/setup-java@v2
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install Android SDK packages
      run: |
        yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses

    # Chaquopy targets Python 3.8, and only emits .pyc when the build interpreter
    # matches. Without this the APK ships .py and the phone compiles esptool on the
    # first flash. Runner images no longer carry 3.8, so install it and make it python3.
    - name: Set up Python 3.8 for Chaquopy
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        "$HOME/.local/bin/uv" python install --default 3.8.18
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Verify python3 is 3.8
      run: |
        python3 -V
        python3 -V | grep -q '^Python 3\.8\.' || {
          echo "::error::python3 is not 3.8 — Chaquopy would ship .py instead of .pyc"
          exit 1
        }

    - name: Build release APK
      run: ./gradlew clean assembleRelease

    # Android's Package Installer expects modern APK Signature Schemes.
    # Use a throwaway key for test builds; no private signing key is committed.
    - name: Align and sign APK (v1/v2/v3)
      run: |
        set -euo pipefail
        BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
        INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
        if [ ! -f "$INPUT" ]; then
          INPUT="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*aligned*' | head -n 1)"
        fi
        test -n "$INPUT" && test -f "$INPUT"
        keytool -genkeypair -noprompt \
          -keystore "$RUNNER_TEMP/bruce-test-signing.jks" \
          -storepass changeit -keypass changeit \
          -alias bruce-test -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=BruceUlli Test Build, OU=Development, O=BruceUlli, C=DE"
        "$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT" "$RUNNER_TEMP/bruce-aligned.apk"
        "$BUILD_TOOLS/apksigner" sign \
          --ks "$RUNNER_TEMP/bruce-test-signing.jks" \
          --ks-key-alias bruce-test \
          --ks-pass pass:changeit --key-pass pass:changeit \
          --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
          --out app/build/outputs/apk/release/BruceUlli.apk \
          "$RUNNER_TEMP/bruce-aligned.apk"
        "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/BruceUlli.apk

    - name: Upload signed APK
      uses: actions/upload-artifact@v4
      with:
        name: BruceUlli-installierbar
        path: app/build/outputs/apk/release/BruceUlli.apk
